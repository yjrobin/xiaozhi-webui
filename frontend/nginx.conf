server {
    listen       80;
    server_name  localhost;

    location /ui/xiaozhi-webui/ {
        alias /usr/share/nginx/html/ui/xiaozhi-webui/;
        index index.html;
        try_files $uri /ui/xiaozhi-webui/index.html;
    }

    # Optional: Redirect root to the subpath
    location = / {
        return 302 /ui/xiaozhi-webui/;
    }

    # Optional: Health check endpoint
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
